<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of preview.png, the 1200x630 picture shown when mankai.art is shared.
     Same look as the site (2026-11-20): the Mankey logo, MANK AI, the three categories.
     Render: node make-preview.js, or headless Edge/Chrome at a 1200x630 window. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#0b0b0c; color:#ededf0; font:400 16px/1.5 "Inter",system-ui,sans-serif;
    display:flex; align-items:center; gap:64px; padding:0 96px; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* the same warm glow as the site's header, centred on the logo */
  body::before{content:""; position:absolute; inset:0;
    background:radial-gradient(560px 460px at 300px 315px, rgba(232,179,74,.13), rgba(220,40,40,.07) 45%, transparent 75%)}
  .badge{position:relative; flex:none; width:360px; height:360px}
  .badge::before{content:""; position:absolute; inset:-14%; border-radius:50%;
    background:radial-gradient(closest-side, rgba(232,179,74,.20), rgba(220,40,40,.12) 55%, transparent 76%)}
  .badge img{position:relative; width:100%; height:100%; object-fit:cover; border-radius:50%;
    -webkit-mask-image:radial-gradient(closest-side,#000 86%,transparent 100%); mask-image:radial-gradient(closest-side,#000 86%,transparent 100%)}
  .in{position:relative}
  h1{font:700 118px/1 "Space Grotesk",system-ui,sans-serif; letter-spacing:.05em; margin-left:-.04em}
  h1 b{color:#e8b34a}
  .cats{margin-top:34px; display:flex; gap:12px}
  .cats span{display:inline-flex; align-items:center; gap:10px; padding:11px 20px; border-radius:999px;
    border:1px solid #2c2c31; background:#121214; font-size:21px; font-weight:500; color:#c9c9d0}
  .cats i{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c)}
  .url{margin-top:36px; font:600 20px/1 "Space Grotesk",system-ui,sans-serif; letter-spacing:.14em; color:#7d7d87}
</style></head>
<body>
  <div class="badge"><img src="mankey.jpg" alt=""></div>
  <div class="in">
    <h1>MANK<b>AI</b></h1>
    <div class="cats">
      <span style="--c:#b7a6ea"><i></i>Animation</span>
      <span style="--c:#5fd0ee"><i></i>Audioreactive</span>
      <span style="--c:#8fbf52"><i></i>Experiences</span>
    </div>
    <div class="url">MANKAI.ART</div>
  </div>
</body></html>
